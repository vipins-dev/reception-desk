# One-command run: PetClinic REST backend + this frontend.
#   docker compose up --build      ->  http://localhost:8080
services:
  petclinic:
    image: springcommunity/spring-petclinic-rest
    ports:
      - '9966:9966' # optional: Swagger UI at http://localhost:9966/petclinic/swagger-ui.html
  web:
    build: .
    environment:
      PORT: '8080'
      BACKEND_URL: http://petclinic:9966
    ports:
      - '8080:8080'
    depends_on:
      - petclinic
